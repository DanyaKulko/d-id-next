services:
  postgres:
    image: postgres:18.1
    container_name: d-id_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    mem_reservation: 1g

  external_sources_cron:
    image: node:20-alpine
    container_name: d-id_external_sources_cron
    working_dir: /app
    command: ["sh", "/app/scripts/cron-entrypoint.sh"]
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      CRON_SECRET: ${CRON_SECRET}
      EXTERNAL_SOURCES_CRON: ${EXTERNAL_SOURCES_CRON}
      EXTERNAL_TEXT_CRON: ${EXTERNAL_TEXT_CRON}
      EXTERNAL_VIDEO_CRON: ${EXTERNAL_VIDEO_CRON}
    volumes:
      - ./:/app
    restart: unless-stopped

volumes:
    pg_data:
